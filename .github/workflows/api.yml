name: Deploy API (Google Cloud Run)
on:
  push: { branches: [main], paths: ['server/**'] }
  workflow_dispatch: {}
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: reachly-515412
          workload_identity_provider: projects/1051995740961/locations/global/workloadIdentityPools/github/providers/repo
          service_account: deployer@reachly-515412.iam.gserviceaccount.com
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: reachly-515412
          service: reachly-api
          region: asia-south1
          source: ./server
          flags: --allow-unauthenticated
          env_vars: SITE_URL=https://infofitsserve.github.io/reachly,API_URL=https://reachly-api-tz3zyfcyxq-el.a.run.app,PAYU_URL=https://test.payu.in/_payment,SENDER_EMAIL=infofitsserve@gmail.com
          secrets: |
            PAYU_KEY=PAYU_KEY:latest
            PAYU_SALT=PAYU_SALT:latest
            JWT_SECRET=JWT_SECRET:latest
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
            BREVO_API_KEY=BREVO_API_KEY:latest
